<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalOcean Demo</title>
<style>
  :root {
    --do-blue: #0069ff;
    --do-blue-dark: #0050c2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--do-blue) 0%, var(--do-blue-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
  }
  .content {
    text-align: center;
    padding: 40px;
  }
  h1 {
    font-size: 2.6rem;
    font-weight: 700;
    margin: 0 0 12px 0;
    letter-spacing: -0.01em;
  }
  p.subtitle {
    font-size: 1.25rem;
    font-weight: 400;
    margin: 0 auto;
    max-width: 560px;
    color: rgba(255, 255, 255, 0.85);
  }
  .hostname {
    margin-top: 40px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>Welcome to DigitalOcean</h1>
    <p class="subtitle">Demonstrating Horizontal Pod Autoscaling on DigitalOcean Kubernetes</p>
    <p class="hostname">Served by pod: {{ hostname }}</p>
  </div>
</body>
</html>
